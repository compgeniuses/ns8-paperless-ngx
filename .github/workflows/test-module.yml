name: Test module
# Under workflow_run, the run belongs to main; display the tested ref.
run-name: "Test ${{ github.event.workflow_run.head_branch || github.ref_name }} on QEMU"

on:
  workflow_dispatch:
    inputs:
      debug_shell:
        description: "Debug shell"
        required: true
        type: boolean
  workflow_run:
    workflows: ["Publish images"]
    types: [completed]

jobs:
  install:
    name: Debian installation
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    uses: NethServer/ns8-github-actions/.github/workflows/test-module-qemu.yml@v1
    with:
      image_name: paperlessngx
      distros: '["debian13"]'
      scenarios: '["install"]'
      ui_tests_strategy: on_renovate_ui_change
      debug_shell: ${{ github.event.inputs.debug_shell == 'true' }}

  upgrade:
    name: Rocky upgrade
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    uses: NethServer/ns8-github-actions/.github/workflows/test-module-qemu.yml@v1
    with:
      image_name: paperlessngx
      distros: '["rocky9"]'
      scenarios: '["update"]'
      ui_tests_strategy: never
      debug_shell: ${{ github.event.inputs.debug_shell == 'true' }}
